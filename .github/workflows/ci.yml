name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to force a cold re-fetch of the provider data.
  RAW_DATA_EPOCH: v1

jobs:
  # Fast feedback that needs no database: types and a production build. Every
  # page is force-dynamic, so the build never touches PostgreSQL.
  static:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  test:
    name: PostgreSQL test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Local development identity. Deliberately NOT a Supabase project: there
      # are no Supabase credentials in CI, and substituting one would make the
      # blocked checks below look like they had passed.
      SETVALUE_ALLOW_LOCAL_AUTH: 'yes'
      SETVALUE_LOCAL_AUTH_SECRET: ci-local-auth-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---------------------------------------------------------------- data
      # The integrity, parity and import suites assert against the real
      # catalog — 174 sets, 20,000+ cards, >85% price coverage. They cannot run
      # against a fixture without becoming a test of the fixture.
      - name: Restore provider data
        id: raw-cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ env.RAW_DATA_EPOCH }}-${{ hashFiles('scripts/fetch-catalog.mjs', 'scripts/fetch-prices.mjs') }}
          restore-keys: raw-${{ env.RAW_DATA_EPOCH }}-

      # Both scripts skip files already on disk, so a warm cache costs seconds
      # and a partial cache only fetches what is missing. This also keeps CI
      # from hammering the public pokemontcg.io API on every run.
      - name: Fetch catalog
        run: node scripts/fetch-catalog.mjs
      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      # ------------------------------------------------------------- schema
      - name: Apply migrations
        run: npm run migrate

      - name: Ingest catalog
        run: npm run ingest:catalog
      - name: Ingest prices
        run: npm run ingest:prices

      - name: Report ingested corpus
        run: |
          psql "$DATABASE_URL" -c "
            select (select count(*) from public.sets)           as sets,
                   (select count(*) from public.cards)          as cards,
                   (select count(*) from public.card_variants)  as printings,
                   (select count(*) from public.prices)         as prices,
                   (select max(observed_on) from public.prices) as newest_price;"

      # -------------------------------------------------------------- tests
      # Includes the adversarial RLS suite, SQL-vs-TypeScript completion
      # parity, catalog integrity, concurrency, demand-index reconciliation,
      # import throughput and the billing feature flag.
      - name: Test suite
        run: npm test

      # ---------------------------------------------------------------- e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          NODE_ENV=production npx next start -p 3100 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/signin && exit 0
            sleep 1
          done
          echo "server did not come up"; cat /tmp/server.log; exit 1

      - name: Browser end-to-end
        run: node tests/e2e/flow.mjs http://localhost:3100

      - name: Concurrency and idempotency over HTTP
        run: |
          COOKIE="$(npx tsx scripts/ci/local-identity.ts ci-concurrency@example.test)"
          node tests/load/concurrency.mjs http://localhost:3100 "$COOKIE"

      - name: Server log
        if: always()
        run: tail -50 /tmp/server.log || true

      # --------------------------------------------------- what was NOT run
      # Stated in the job summary so a green tick is not read as more coverage
      # than it is.
      - name: Declare unverified surface
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Not verified by this run

          These need credentials or extensions that do not exist in CI. They are
          reported here rather than stubbed, skipped silently, or asserted against
          a substitute that would make them look green.

          - **Supabase Auth** — no project credentials. Password verification, magic
            links and password reset are Supabase's; CI runs the local development
            identity provider instead, so the browser check *"a wrong password is
            rejected"* reports `BLOCKED` rather than passing. The sign-in throttle in
            front of it *is* exercised.
          - **pg_cron / pg_net scheduling** — not available on the stock `postgres:16`
            image. Migration 0007 detects this and skips registration;
            `supabase/schedule.sql` is deliberately not applied here. The hourly price
            and nightly catalog jobs are therefore unscheduled in CI, though the
            functions they call are exercised by the ingest steps above.
          - **Supavisor connection pooler** — CI connects straight to PostgreSQL. The
            transaction-mode pooler that production uses on Vercel is untested here.
          - **The 5,001-collector load harness** — generating that population takes
            about six minutes and measures the runner more than the code. Run it
            locally with `npm run load:generate -- 5000`.
          EOF
